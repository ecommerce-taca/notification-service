name: CI

# Trigger: mọi PR + push lên main/develop đều chạy test & build.
# Chỉ push image lên Docker Hub khi push lên main (production).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache npm để `npm ci` nhanh hơn giữa các lần chạy
          cache: npm

      - run: npm ci
      # typecheck trước (rẻ + nhanh) để fail sớm trước khi chạy test
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build & Push Docker image
    needs: test
    # Chỉ push image khi push lên main — PR/develop không push (tránh image tràn Docker Hub)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Đăng nhập Docker Hub bằng secret (không hardcode credential)
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # tag: latest + commit SHA (để rollback được theo SHA)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }}
